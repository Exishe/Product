name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On the development branch a run in progress is finished and only the newest waiting run is kept,
  # so a result is never lost to the next push (the database step and the browser tests take minutes).
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/new-session-qjsyvc' }}

jobs:
  checks:
    name: Lint, types, unit tests, licenses, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-licenses.ts
      - run: node scripts/check-audit.mjs

  sql:
    name: SQL tests (plain Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test-sql.sh

  e2e:
    # One job per screen size, side by side: the whole suite took more than the 20-minute limit in one job
    # (every project ran after the other against the same cloud database).
    name: Browser tests (${{ matrix.project }})
    strategy:
      fail-fast: false
      # One screen size at a time: the free dev database timed out under three suites at once
      # (phone alone: 9 minutes, 2 failures; tablet and desktop together: 19 minutes, 8 to 12).
      max-parallel: 1
      matrix:
        project: [phone, tablet, desktop]
    # Runs after the cloud database is up to date (or when migrate is skipped,
    # as on pull requests), never against a half-applied schema.
    needs: [migrate]
    if: ${{ !cancelled() && needs.migrate.result != 'failure' }}
    # Browser tests of every branch share one small cloud database; two runs at once made it time out
    # (sign-ups stuck, 500s, 30-minute limit hit). One run per screen size at a time, across branches.
    concurrency:
      group: e2e-dev-db-${{ matrix.project }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Public by design (the publishable key only works under RLS). Tests that
      # sign in as the demo owner skip here until a secret password is added.
      NEXT_PUBLIC_SUPABASE_URL: https://mhuxfmdehkgpjunxgptc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2EI1Ww6HGoh0Y5mpXBV0ig_CnvXcxKX
      APP_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }} --trace off

  migrate:
    name: Apply migrations to restaurant-os-dev
    # Only from the development branch, only after the SQL tests pass, and only
    # once the owner has added the SUPABASE_ACCESS_TOKEN repository secret.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/claude/new-session-qjsyvc'
    needs: [sql, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: migrate-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      SUPABASE_YES: "1"
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::SUPABASE_ACCESS_TOKEN is not set; migrations were not applied."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - if: env.HAS_TOKEN == 'true'
        name: Show what will be applied
        run: npx supabase db push --remote=mhuxfmdehkgpjunxgptc --skip-vault --dry-run
      - if: env.HAS_TOKEN == 'true'
        name: Apply
        run: npx supabase db push --remote=mhuxfmdehkgpjunxgptc --skip-vault --yes
