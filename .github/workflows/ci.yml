name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, licenses, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-licenses.ts
      - run: npm audit --audit-level=high

  sql:
    name: SQL tests (plain Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test-sql.sh

  e2e:
    name: Browser tests (phone, tablet, desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Public by design (the publishable key only works under RLS). Tests that
      # sign in as the demo owner skip here until a secret password is added.
      NEXT_PUBLIC_SUPABASE_URL: https://mhuxfmdehkgpjunxgptc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2EI1Ww6HGoh0Y5mpXBV0ig_CnvXcxKX
      APP_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  migrate:
    name: Apply migrations to restaurant-os-dev
    # Only from the development branch, only after the SQL tests pass, and only
    # once the owner has added the SUPABASE_ACCESS_TOKEN repository secret.
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/new-session-qjsyvc'
    needs: [sql, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: migrate-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      SUPABASE_YES: "1"
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::SUPABASE_ACCESS_TOKEN is not set; migrations were not applied."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - if: env.HAS_TOKEN == 'true'
        name: Show what will be applied
        run: npx supabase db push --remote=mhuxfmdehkgpjunxgptc --dry-run
      - if: env.HAS_TOKEN == 'true'
        name: Apply
        run: npx supabase db push --remote=mhuxfmdehkgpjunxgptc --yes
